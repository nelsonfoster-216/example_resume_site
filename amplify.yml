version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - echo "Starting build process..."
            - ls -la
            - echo "Current directory: $(pwd)"
            - chmod +x ./deploy-script.sh
        build:
          commands:
            - ./deploy-script.sh
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - resume-2023/node_modules/**/*
          - resume-2023-new/node_modules/**/*
    appRoot: . 