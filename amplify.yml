version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install
            - ls -la
            - chmod +x ./deploy-script.sh
        build:
          commands:
            - bash ./deploy-script.sh || (echo "Script failed!" && cat deploy-script.sh && exit 1)
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: . 